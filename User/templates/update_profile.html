<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-100 min-h-screen flex justify-center items-center py-10">

    <div class="bg-white w-1/2 p-8 rounded-xl shadow-xl">
        <h2 class="text-3xl font-bold text-pink-500 mb-6 text-center">Update Profile</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="w-full bg-pink-500 text-white py-3 rounded-lg hover:bg-pink-600 transition text-lg font-semibold">Save Changes</button>
        </form>
    </div>

</body>
</html>
