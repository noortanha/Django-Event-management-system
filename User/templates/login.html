<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 flex items-center justify-center h-screen">

    <div class="bg-white shadow-lg rounded-2xl p-10 w-full max-w-md">
        <h1 class="text-3xl font-bold text-pink-600 text-center mb-6">Log in to your account</h1>
        
        <form method="POST" class="space-y-5">
    {% csrf_token %}
    
    {% if messages %}
      <div>
        {% for message in messages %}
          <p class="text-red-600 text-sm">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
            
            <div>
                <input 
                    type="text" 
                    name="username" 
                    placeholder="Enter your username" 
                    class="w-full px-4 py-3 rounded-lg border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 placeholder-pink-400"
                    required
                >
            </div>

            <div>
                <input 
                    type="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    class="w-full px-4 py-3 rounded-lg border border-pink-200 focus:outline-none focus:ring-2 focus:ring-pink-300 placeholder-pink-400"
                    required
                >
            </div>

            <button 
                type="submit" 
                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition-colors"
            >
                Sign In
            </button>
        </form>

        <p class="text-center text-pink-400 mt-6">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-pink-600 font-semibold hover:underline">Register</a>
        </p>
    </div>

</body>
</html>
