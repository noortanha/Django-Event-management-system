<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 flex items-center justify-center min-h-screen">

    <div class="bg-white shadow-lg rounded-2xl p-10 w-full max-w-md">
        <h1 class="text-3xl font-bold text-pink-600 text-center mb-6">Create your account</h1>
        
        <form method="POST" class="space-y-5">
        
            {% csrf_token %}
            
            {% for field in form %}
                <div class="text-pink-400 font-semibold">
                    {{ field.label_tag }}
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-sm mt-1">{{ field.errors }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button 
                type="submit" 
                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition-colors"
            >
                Register
            </button>
        </form>

        <p class="text-center text-pink-400 mt-6">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-pink-600 font-semibold hover:underline">Login</a>
        </p>
    </div>

</body>
</html>
