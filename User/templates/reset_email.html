<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 flex items-center justify-center h-screen">

    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">
        <h1 class="text-2xl font-bold text-pink-600 mb-4">Reset Your Password</h1>
        <p class="text-pink-700 mb-6">
            Hi {{ user.get_full_name|default:user.username }},
        </p>
        <p class="text-pink-600 mb-6">
            You requested a password reset. Click the button below to reset your password:
        </p>

        <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token % }" 
           class="block text-center bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition mb-6">
           Reset Password
        </a>

        <p class="text-pink-400 text-sm">
            If you did not request this, you can safely ignore this email.
        </p>

        <p class="text-pink-400 text-sm mt-4">
            Thank you<br>
            
        </p>
    </div>

</body>
</html>
