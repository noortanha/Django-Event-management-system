<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 flex items-center justify-center h-screen">

<div class="bg-white shadow-lg rounded-2xl p-10 w-full max-w-md">
    <h1 class="text-3xl font-bold text-pink-600 text-center mb-6">Change Password</h1>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        {{ form.as_p }}

        <button 
            type="submit" 
            class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition-colors"
        >
            Update Password
        </button>
    </form>

    <p class="text-center text-pink-400 mt-6">
        <a href="{% url 'dashboard_redirect' %}" 
           class="text-pink-600 font-semibold hover:underline">
           Back to Dashboard
        </a>
    </p>
</div>

</body>
</html>
