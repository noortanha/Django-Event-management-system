<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 flex items-center justify-center h-screen">

<div class="bg-white shadow-lg rounded-2xl p-10 w-full max-w-md text-center">
    <h1 class="text-3xl font-bold text-green-600 mb-4">Password Updated!</h1>
    <p class="text-gray-600 mb-6">
        Your password has been changed successfully.
    </p>

    <a href="{% url 'login' %}" 
       class="bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
        Login Again
    </a>
</div>

</body>
</html>
