{% extends "events/base.html" %}
{% load static %}

{% block title %} Add Participant {% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-10 bg-pink-100 shadow-2xl rounded-2xl p-8">
    <h1 class="text-3xl font-bold text-center text-pink-700 mb-6"> Add New Participant</h1>

   
    {% if messages %}
        {% for message in messages %}
            <div class="mb-4 text-white px-4 py-3 rounded-lg {% if message.tags == 'success' %}bg-green-500{% else %}bg-red-500{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="flex justify-center">
            <button type="submit"
                class="bg-pink-600 hover:bg-pink-700 text-white px-6 py-2 rounded-lg shadow-lg transition">
                Add Participant
            </button>
        </div>
    </form>

    
    
</div>
{% endblock %}
